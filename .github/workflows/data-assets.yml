name: Data Assets

on:
  push:
    branches: [main, develop]
    paths:
      - src/bin/Data/**
      - src/bin/fonts/**
      - .github/workflows/data-assets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-data:
    name: Publish data asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and identify data
        shell: bash
        run: |
          test -f src/bin/Data/Dec2.dat
          test -f src/bin/fonts/DejaVuSans.ttf

          data_tree=$(git rev-parse HEAD:src/bin/Data)
          fonts_tree=$(git rev-parse HEAD:src/bin/fonts)
          asset_id=$(printf '%s\n%s\n' "$data_tree" "$fonts_tree" | sha256sum | cut -c1-16)

          {
            echo "asset_id=${asset_id}"
            echo "archive=MuMain-data-${asset_id}.tar.gz"
            echo "tag=data-${asset_id}"
          } >> "$GITHUB_ENV"

      - name: Archive and checksum data
        shell: bash
        run: |
          data_timestamp=$(git log -1 --format=%ct -- src/bin/Data src/bin/fonts)
          tar -czf "$archive" \
            --sort=name \
            --mtime="@${data_timestamp}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C src/bin Data fonts
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum --check "${archive}.sha256"

      - name: Publish data release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "MuMain data ${asset_id}" \
              --notes "Content-addressed Data/ and fonts/ for MuMain runtime releases." \
              --latest=false
          fi
          gh release upload "$tag" "$archive" "${archive}.sha256" --clobber

      # Every different Data/ + fonts/ content gets its own release, which would pile up
      # (427 MB each). Keep the newest ones so the launcher can still download them, and
      # remove the older ones.
      - name: Remove old data releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DATA_RELEASES: 3
        run: |
          old_releases=$(gh release list --exclude-drafts --limit 200 --json tagName,createdAt \
            | python3 -c "
          import json, os, sys
          keep = int(os.environ['KEEP_DATA_RELEASES'])
          releases = json.load(sys.stdin)
          data_releases = [r for r in releases if r['tagName'].startswith('data-')]
          data_releases.sort(key=lambda r: r['createdAt'], reverse=True)
          print('\n'.join(r['tagName'] for r in data_releases[keep:]))
          ")

          if [ -z "$old_releases" ]; then
            echo "No old data release to remove."
            exit 0
          fi

          printf '%s\n' "$old_releases" | while read -r old_tag; do
            [ -n "$old_tag" ] || continue
            echo "Removing the old data release $old_tag."
            gh release delete "$old_tag" --cleanup-tag --yes
          done
